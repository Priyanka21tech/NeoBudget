<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style_dashboard.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <h2>{{ username }}</h2>
            <ul>
                <li><a href="/dashboard">Dashboard</a></li>
                <li><a href="/visualize">Visualize Expenses</a></li>
                <li><a href="/upload_expenses">Upload file</a></li>
                <li><a href="/save_expenses">Download Expenses</a></li>
                <li><a href="/logout" class="logout-btn">Logout</a></li>
            </ul>
        </div>

        <div class="main-content">
            <h1>Expense Tracker</h1>

                     

            <form action="/add_expense" method="POST">
                <label>Date:</label>
                <input type="date" name="date" required>

                <label>Category:</label>
                <select name="category">
                    <option>Food</option>
                    <option>Transport</option>
                    <option>Entertainment</option>
                    <option>Utilities</option>
                    <option>Other</option>
                </select>

                <label>Amount:</label>
                <input type="number" name="amount" step="0.01" required>

                <label>Description:</label>
                <input type="text" name="description">

                <button type="submit">Add Expense</button>
            </form>

            <h2>Expenses</h2>
            <table border="1">
                <tr>
                    <th>Date</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Description</th>
                </tr>
                {% for expense in expenses %}
                <tr>
                    <td>{{ expense[2] }}</td>
                    <td>{{ expense[3] }}</td>
                    <td>{{ expense[4] }}</td>
                    <td>{{ expense[5] }}</td>
                </tr>
                {% endfor %}
            </table>

            <!-- Chatbot Section -->
            <div id="chat-container" style="margin-top: 40px; margin-bottom: 20px; border-top: 1px solid #ece1e1; padding-top: 20px;">
                <h3>Chatbot</h3>
                <div id="chat-box" style="border:1px solid #417511; padding:10px; height:100px; overflow-y:scroll;">
                    <!-- Messages will appear here -->
                </div>
                <input type="text" id="user-input" placeholder="Ask something..." style="width:90%; padding: 10px;">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>
    </div>

    <script>
        function sendMessage() {
            const userInput = document.getElementById("user-input").value;
            document.getElementById("user-input").value = "";
            const chatBox = document.getElementById("chat-box");
            chatBox.innerHTML += "<p><strong>You:</strong> " + userInput + "</p>";

            fetch("/chat", {
                method: "POST",
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ message: userInput })
            })
            .then(res => res.json())
            .then(data => {
                chatBox.innerHTML += "<p><strong>Bot:</strong> " + data.reply + "</p>";
                chatBox.scrollTop = chatBox.scrollHeight;
            });
        }


    </script>
</body>
</html>
