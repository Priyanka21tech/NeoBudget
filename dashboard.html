<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style_dashboard.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <h2>{{ username }}</h2>
            <ul>
                <li><a href="/dashboard">Dashboard</a></li>
                <li><a href="/visualize">Visualize Expenses</a></li>
                <li><a href="/upload_expenses">Upload file</a></li>
                <li><a href="/save_expenses">Download Expenses</a></li>
                <li><a href="/logout" class="logout-btn">Logout</a></li>
            </ul>
        </div>

        <div class="main-content">
            <h1>Expense Tracker</h1>

                     

            <form action="/add_expense" method="POST">
                <label>Date:</label>
                <input type="date" name="date" required>

                <label>Category:</label>
                <select name="category">
                    <option>Food</option>
                    <option>Transport</option>
                    <option>Entertainment</option>
                    <option>Utilities</option>
                    <option>Other</option>
                </select>

                <label>Amount:</label>
                <input type="number" name="amount" step="0.01" required>

                <label>Description:</label>
                <input type="text" name="description">

                <button type="submit">Add Expense</button>
            </form>

            <h2>Expenses</h2>
            <table border="1">
                <tr>
                    <th>Date</th>
                    <th>Category</th>
                    <th>Amount</th>
                    <th>Description</th>
                </tr>
                {% for expense in expenses %}
                <tr>
                    <td>{{ expense[2] }}</td>
                    <td>{{ expense[3] }}</td>
                    <td>{{ expense[4] }}</td>
                    <td>{{ expense[5] }}</td>
                </tr>
                {% endfor %}
            </table>

            <!-- Chatbot Section -->
             <!-- Floating Chat Button -->
        <div id="chat-toggle" onclick="toggleChat()">💬</div>

        <!-- Chat Popup -->
        <div id="chat-container">
            <header>
                Chatbot
                <span onclick="toggleChat()">✖</span>
            </header>
            <div id="chat-box">
                <!-- Messages will appear here -->
            </div>
            <div style="display: flex; border-top: 1px solid #ddd;">
                <input type="text" id="user-input" placeholder="Ask something...">
                <button onclick="sendMessage()">Send</button>
            </div>
        </div>


        <script>
            function toggleChat() {
                const chat = document.getElementById("chat-container");
                chat.style.display = chat.style.display === "flex" ? "none" : "flex";
            }
                    
            function sendMessage() {
                const input = document.getElementById("user-input");
                const chatBox = document.getElementById("chat-box");
                const userMessage = input.value.trim();
            
                if (!userMessage) return;
            
                // Show user message
                const userBubble = document.createElement("div");
                userBubble.style.margin = "5px 0";
                userBubble.style.textAlign = "right";
                userBubble.innerHTML = `<span style="background:#d9fdd3; padding:8px 12px; border-radius:20px; display:inline-block;">${userMessage}</span>`;
                chatBox.appendChild(userBubble);
            
                // Send message to Flask backend
                fetch('/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: userMessage })
                })
                .then(response => response.json())
                .then(data => {
                    const botBubble = document.createElement("div");
                    botBubble.style.margin = "5px 0";
                    botBubble.style.textAlign = "left";
                    botBubble.innerHTML = `<span style="background:#ececec; padding:8px 12px; border-radius:20px; display:inline-block;">${data.reply}</span>`;
                    chatBox.appendChild(botBubble);
                    chatBox.scrollTop = chatBox.scrollHeight;
                })
                .catch(error => {
                    const errorBubble = document.createElement("div");
                    errorBubble.innerHTML = `<span style="color:red;">Error: ${error}</span>`;
                    chatBox.appendChild(errorBubble);
                });
            
                input.value = "";
                chatBox.scrollTop = chatBox.scrollHeight;
            }
            </script>
            

        
            
</body>
</html>
