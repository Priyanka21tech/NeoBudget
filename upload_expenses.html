<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Expenses</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style_dashboard.css') }}">
</head>
<body>
    <div class="dashboard-container">
        <div class="sidebar">
            <h2>{{ username }}</h2>
            <ul>
                <li><a href="/dashboard">Dashboard</a></li>
                <li><a href="/visualize">Visualize Expenses</a></li>
                <li><a href="/logout" class="logout-btn">Logout</a></li>
            </ul>
        </div>

        <div class="main-content">
            <h1>Upload Expense File</h1>
            {% if message %}
                <p class="success-message">{{ message }}</p>
            {% endif %}
            
            <form action="/upload_expenses" method="POST" enctype="multipart/form-data">
                <input type="file" name="file" required>
                <button type="submit">Upload CSV</button>
            </form>
            
                    </div>
    </div>
</body>
</html>
